name: Build ImmortalWrt 25.12.2 Netcore N30 Pro Final


on:
  workflow_dispatch:


permissions:
  contents: read


jobs:

  build:

    runs-on: ubuntu-24.04


    steps:


      - name: Install build dependencies
        shell: bash
        run: |
          set -e

          sudo bash -c \
          'bash <(curl -fsSL https://build-scripts.immortalwrt.org/init_build_environment.sh)'



      - name: Clone ImmortalWrt 25.12.2
        shell: bash
        run: |
          set -e


          git clone \
          --depth 1 \
          --branch v25.12.2 \
          https://github.com/immortalwrt/immortalwrt.git \
          immortalwrt



          cd immortalwrt


          echo "ImmortalWrt version"

          git describe --tags --always



      - name: Clone Netcore N30 Pro patch
        shell: bash
        run: |
          set -e


          git clone \
          --depth 1 \
          https://github.com/liuyi-htu/Netcore-N30-Pro-patch-for-OpenWrt.git \
          n30-patch




      - name: Apply Netcore N30 Pro patch
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          echo "Applying Netcore N30 Pro patch"



          bash ../n30-patch/scripts/apply-netcore-n30pro.sh \
          ../n30-patch



      - name: Verify Netcore N30 Pro files
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          DTS="target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts"


          if [ ! -f "$DTS" ]; then

              echo "ERROR: Netcore N30 Pro DTS missing"

              find target/linux/mediatek/dts \
              -iname "*n30*" \
              -print

              exit 1

          fi



          echo "DTS OK"




          grep -q \
          "define Device/netcore_n30-pro" \
          target/linux/mediatek/image/filogic.mk



          echo "Device definition OK"

      - name: Update feeds
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          ./scripts/feeds update -a

          ./scripts/feeds install -a



      - name: Configure Netcore N30 Pro
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          rm -f .config



          #
          # Target
          #

          echo "CONFIG_TARGET_mediatek=y" >> .config

          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config

          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n30-pro=y" >> .config



          #
          # LuCI
          #

          echo "CONFIG_PACKAGE_luci=y" >> .config

          echo "CONFIG_PACKAGE_luci-ssl=y" >> .config



          #
          # USB 3.0
          #

          echo "CONFIG_PACKAGE_kmod-usb3=y" >> .config

          echo "CONFIG_PACKAGE_kmod-usb-storage=y" >> .config

          echo "CONFIG_PACKAGE_kmod-usb-storage-uas=y" >> .config

          echo "CONFIG_PACKAGE_block-mount=y" >> .config

          echo "CONFIG_PACKAGE_blockd=y" >> .config



          #
          # Filesystem
          #

          echo "CONFIG_PACKAGE_kmod-fs-ext4=y" >> .config

          echo "CONFIG_PACKAGE_kmod-fs-vfat=y" >> .config

          echo "CONFIG_PACKAGE_kmod-fs-exfat=y" >> .config



          #
          # USB 4G/5G modem / USB WiFi
          #

          echo "CONFIG_PACKAGE_kmod-usb-net=y" >> .config

          echo "CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y" >> .config

          echo "CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y" >> .config

          echo "CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y" >> .config


          echo "CONFIG_PACKAGE_kmod-usb-serial=y" >> .config

          echo "CONFIG_PACKAGE_kmod-usb-serial-option=y" >> .config

          echo "CONFIG_PACKAGE_kmod-usb-wdm=y" >> .config


          echo "CONFIG_PACKAGE_usb-modeswitch=y" >> .config

          echo "CONFIG_PACKAGE_uqmi=y" >> .config

          echo "CONFIG_PACKAGE_umbim=y" >> .config



          #
          # MWAN3 Load Balance
          #

          echo "CONFIG_PACKAGE_mwan3=y" >> .config

          echo "CONFIG_PACKAGE_luci-app-mwan3=y" >> .config



          #
          # Samba4
          #

          echo "CONFIG_PACKAGE_samba4-server=y" >> .config

          echo "CONFIG_PACKAGE_luci-app-samba4=y" >> .config



          #
          # Network tools
          #

          echo "CONFIG_PACKAGE_curl=y" >> .config

          echo "CONFIG_PACKAGE_wget-ssl=y" >> .config

          echo "CONFIG_PACKAGE_tcpdump=y" >> .config

          echo "CONFIG_PACKAGE_htop=y" >> .config



          #
          # Generate final config
          #

          make defconfig



          echo "===== Final Target ====="

          grep \
          "CONFIG_TARGET_mediatek_filogic_DEVICE" \
          .config




      - name: Verify final configuration
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          echo "Checking target"



          grep -Fxq \
          "CONFIG_TARGET_mediatek_filogic_DEVICE_netcore_n30-pro=y" \
          .config



          echo "Checking USB packages"



          grep -Fxq \
          "CONFIG_PACKAGE_kmod-usb3=y" \
          .config



          grep -Fxq \
          "CONFIG_PACKAGE_kmod-usb-storage=y" \
          .config



          echo "Checking MWAN3"



          grep -Fxq \
          "CONFIG_PACKAGE_mwan3=y" \
          .config



          echo "Checking Samba4"



          grep -Fxq \
          "CONFIG_PACKAGE_samba4-server=y" \
          .config



          echo "Configuration verification passed"




      - name: Inject custom IPK packages
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          mkdir -p \
          files/usr/share/custom-packages



          if [ -d ../custom_packages ]; then

              cp \
              ../custom_packages/*.ipk \
              files/usr/share/custom-packages/ \
              2>/dev/null || true

          fi



          echo "Custom IPK injection complete"




      - name: Download packages
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          make download \
          -j$(nproc) \
          V=s
      - name: Build firmware
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          echo "================================"
          echo "Build ImmortalWrt 25.12.2"
          echo "Netcore N30 Pro"
          echo "================================"


          make -j$(nproc) V=s \
          || make -j1 V=s




      - name: Verify USB XHCI modules
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          echo "================================"
          echo "Verify XHCI modules"
          echo "================================"


          echo "Search xhci-hcd.ko"

          find build_dir \
          -name "xhci-hcd.ko" \
          -print



          echo

          echo "Search xhci-mtk-hcd.ko"

          find build_dir \
          -name "xhci-mtk-hcd.ko" \
          -print



          XHCI=$(find build_dir \
          -name "xhci-hcd.ko" \
          | wc -l)



          MTK=$(find build_dir \
          -name "xhci-mtk-hcd.ko" \
          | wc -l)



          if [ "$XHCI" -eq 0 ]; then

              echo "ERROR: xhci-hcd.ko missing"

              exit 1

          fi



          if [ "$MTK" -eq 0 ]; then

              echo "ERROR: xhci-mtk-hcd.ko missing"

              exit 1

          fi



          echo "XHCI verification passed"





      - name: Verify N30 DTS after build
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          DTS="target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts"



          if [ ! -f "$DTS" ]; then

              echo "ERROR: N30 DTS missing"

              exit 1

          fi



          echo "Checking USB VBUS"



          grep -Fq \
          "usb-vbus" \
          "$DTS"



          grep -Fq \
          "GPIO_ACTIVE_HIGH" \
          "$DTS"



          grep -Fq \
          "vbus-supply" \
          "$DTS"



          echo "N30 DTS verification passed"





      - name: Verify generated firmware
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          TARGET="bin/targets/mediatek/filogic"



          echo "================================"
          echo "Generated files"
          echo "================================"


          find "$TARGET" \
          -maxdepth 2 \
          -type f \
          -print \
          | sort



          echo

          echo "Check forbidden N60"



          if find "$TARGET" \
          -type f \
          -iname "*n60*" \
          | grep -q .; then


              echo "ERROR: N60 firmware detected"

              exit 1

          fi



          echo

          echo "Check N30"



          if ! find "$TARGET" \
          -type f \
          \( \
          -iname "*n30*" \
          -o \
          -iname "*netcore*" \
          \) \
          | grep -q .; then


              echo "ERROR: Netcore N30 firmware not found"

              exit 1

          fi



          echo "Firmware verification passed"





      - name: Generate build report
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          REPORT="n30pro-build-report.txt"



          {

          echo "=========================================="

          echo "ImmortalWrt 25.12.2"

          echo "Netcore N30 Pro"

          echo "=========================================="



          echo

          echo "Git version:"

          git describe --tags --always



          echo

          echo "Commit:"

          git rev-parse HEAD



          echo

          echo "Target:"

          grep \
          "CONFIG_TARGET_mediatek_filogic_DEVICE" \
          .config || true



          echo

          echo "USB packages:"

          grep \
          "CONFIG_PACKAGE_kmod-usb" \
          .config || true



          echo

          echo "XHCI modules:"

          find build_dir \
          -name "xhci*.ko" \
          -print



          echo

          echo "Firmware:"

          find bin/targets/mediatek/filogic \
          -type f \
          | grep -Ei "n30|netcore"



          } > "$REPORT"



          cat "$REPORT"





      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:

          name: ImmortalWrt-25.12.2-Netcore-N30-Pro

          path: |

            immortalwrt/bin/targets/mediatek/filogic/**

            immortalwrt/n30pro-build-report.txt

          if-no-files-found: error

          retention-days: 7
