name: Build ImmortalWrt 25.12.2 Netcore N30 Pro

on:
  workflow_dispatch:

env:
  IMMORTALWRT_TAG: v25.12.2
  STARVPN_IPK: packages/starvpn_6.1.0_aarch64_cortex-a53.ipk

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install build dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            zstd \
            file


      - name: Clone ImmortalWrt
        run: |
          git clone \
            --depth 1 \
            --branch "${IMMORTALWRT_TAG}" \
            https://github.com/immortalwrt/immortalwrt.git \
            immortalwrt


      - name: Verify source version
        working-directory: immortalwrt
        run: |
          git describe --tags


      - name: Verify target
        working-directory: immortalwrt
        run: |
          test -d target/linux/mediatek
          test -d target/linux/mediatek/image


      - name: Verify N30 Pro device definition
        working-directory: immortalwrt
        run: |
          grep -q \
          "Device/netis_nx30v2" \
          target/linux/mediatek/image/filogic.mk


      - name: Check DTS USB support
        working-directory: immortalwrt
        run: |

          DTS_LINE=$(awk '
          /define Device\/netis_nx30v2/ {
              found=1
          }
          found && /DEVICE_DTS/ {
              print
              exit
          }
          ' target/linux/mediatek/image/filogic.mk)


          echo "$DTS_LINE"


          if [ -z "$DTS_LINE" ]; then
              echo "Cannot find DEVICE_DTS"
              exit 1
          fi


          DTS_NAME=$(echo "$DTS_LINE" | awk '{print $2}')


          DTS_FILE=$(find \
          target/linux/mediatek/dts \
          -name "${DTS_NAME}.dts" \
          | head -n1)


          if [ ! -f "$DTS_FILE" ]; then
              echo "DTS file not found"
              exit 1
          fi


          echo "Using DTS:"
          echo "$DTS_FILE"


          grep -q "xhci" "$DTS_FILE"


          grep -Eq \
          "vbus-supply|usb-vbus|regulator-usb" \
          "$DTS_FILE"



      - name: Import StarVPN package
        run: |

          test -f "${STARVPN_IPK}"


          mkdir -p /tmp/starvpn


          tar xf \
          "${STARVPN_IPK}" \
          -C /tmp/starvpn


          tar xf \
          /tmp/starvpn/data.tar.gz \
          -C /tmp/starvpn


          mkdir -p \
          immortalwrt/package/starvpn/starvpn/files


          cp -a \
          /tmp/starvpn/usr \
          immortalwrt/package/starvpn/starvpn/files/


          cp -a \
          /tmp/starvpn/etc \
          immortalwrt/package/starvpn/starvpn/files/



      - name: Create StarVPN package
        run: |

          mkdir -p \
          immortalwrt/package/starvpn/starvpn


          cat > immortalwrt/package/starvpn/starvpn/Makefile <<'EOF'
include $(TOPDIR)/rules.mk

PKG_NAME:=starvpn
PKG_VERSION:=6.1.0
PKG_RELEASE:=1

include $(INCLUDE_DIR)/package.mk


define Package/starvpn
  SECTION:=net
  CATEGORY:=Network
  TITLE:=StarVPN Mesh Network
  DEPENDS:=+kmod-tun
endef


define Package/starvpn/install

	$(INSTALL_DIR) $(1)/usr/bin

	cp -a ./files/usr/bin/* \
		$(1)/usr/bin/


	$(INSTALL_DIR) $(1)/etc/init.d

	cp -a ./files/etc/init.d/starvpn \
		$(1)/etc/init.d/

endef


$(eval $(call BuildPackage,starvpn))
EOF



      - name: Add StarVPN feed
        working-directory: immortalwrt
        run: |

          echo \
          "src-link starvpn $(pwd)/package/starvpn" \
          >> feeds.conf.default


          ./scripts/feeds update -a


          ./scripts/feeds install -a


          ./scripts/feeds install starvpn



      - name: Generate config
        working-directory: immortalwrt
        run: |

          cat > .config <<'EOF'
CONFIG_TARGET_mediatek=y
CONFIG_TARGET_mediatek_filogic=y
CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netis_nx30v2=y

CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-ssl=y

CONFIG_PACKAGE_kmod-usb3=y
CONFIG_PACKAGE_kmod-usb-storage=y
CONFIG_PACKAGE_kmod-usb-storage-uas=y
CONFIG_PACKAGE_block-mount=y

CONFIG_PACKAGE_kmod-usb-net=y
CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y

CONFIG_PACKAGE_kmod-usb-serial=y
CONFIG_PACKAGE_kmod-usb-serial-option=y
CONFIG_PACKAGE_kmod-usb-wdm=y

CONFIG_PACKAGE_usb-modeswitch=y
CONFIG_PACKAGE_uqmi=y
CONFIG_PACKAGE_umbim=y

CONFIG_PACKAGE_mwan3=y
CONFIG_PACKAGE_luci-app-mwan3=y

CONFIG_PACKAGE_samba4-server=y
CONFIG_PACKAGE_luci-app-samba4=y

CONFIG_PACKAGE_kmod-tun=y
CONFIG_PACKAGE_starvpn=y
EOF


          make defconfig



      - name: Verify configuration
        working-directory: immortalwrt
        run: |

          grep \
          "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netis_nx30v2=y" \
          .config


          grep \
          "CONFIG_PACKAGE_starvpn=y" \
          .config



      - name: Download sources
        working-directory: immortalwrt
        run: |
          make download -j$(nproc)



      - name: Build firmware
        working-directory: immortalwrt
        run: |
          make -j$(nproc) V=s



      - name: Firmware audit
        working-directory: immortalwrt
        run: |

          TARGET="bin/targets/mediatek/filogic"


          test -d "$TARGET"


          if grep -Rqi "h3c" "$TARGET"; then
              echo "ERROR: H3C firmware detected"
              exit 1
          fi


          if grep -Rqi "n60" "$TARGET"; then
              echo "ERROR: N60 firmware detected"
              exit 1
          fi


          echo "Firmware audit passed"



      - name: Collect firmware
        run: |

          mkdir -p output


          cp immortalwrt/.config \
          output/config.buildinfo


          cp -a \
          immortalwrt/bin/targets/mediatek/filogic/* \
          output/



      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-25.12.2-Netcore-N30-Pro
          path: output/
