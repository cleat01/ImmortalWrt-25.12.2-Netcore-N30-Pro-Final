name: Build ImmortalWrt 25.12.2 Netcore N30 Pro Final

on:
  workflow_dispatch:


env:
  IMMORTALWRT_TAG: v25.12.2
  PATCH_REPO: https://github.com/liuyi-htu/Netcore-N30-Pro-patch-for-OpenWrt.git


jobs:

  build:

    runs-on: ubuntu-24.04


    steps:


      - name: Checkout repository
        uses: actions/checkout@v5



      - name: Install dependencies
        run: |

          sudo apt update

          sudo apt install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            zstd \
            file \
            patch \
            binutils



      - name: Clone ImmortalWrt
        run: |

          git clone \
          --depth 1 \
          --branch ${IMMORTALWRT_TAG} \
          https://github.com/immortalwrt/immortalwrt.git \
          immortalwrt



      - name: Clone N30 Pro patch
        run: |

          git clone \
          --depth 1 \
          ${PATCH_REPO} \
          n30pro-patch



      - name: Apply N30 Pro patch
        working-directory: immortalwrt
        run: |

          set -e


          PATCH=$(find ../n30pro-patch \
          -name "*.patch" \
          | sort \
          | head -1)


          if [ -z "$PATCH" ]; then

              echo "N30 patch missing"

              exit 1

          fi



          awk '

          BEGIN {
              block=""
              skip=0
          }


          /^diff --git/ {

              if(block!="" && skip==0)
                  print block


              block=$0 "\n"


              if($0 ~ /11_fix_wifi_mac/)
                  skip=1
              else
                  skip=0


              next

          }


          {
              block=block $0 "\n"
          }


          END {

              if(block!="" && skip==0)
                  print block

          }


          ' "$PATCH" > /tmp/n30pro.patch



          patch \
          -p1 \
          --forward \
          < /tmp/n30pro.patch



      - name: Prepare StarVPN package
        run: |

          set -e


          cd ${GITHUB_WORKSPACE}



          IPK=$(find . \
          -name "starvpn*.ipk" \
          | head -1)



          if [ -z "$IPK" ]; then

              echo "StarVPN IPK missing"

              exit 1

          fi



          echo "Using:"
          echo "$IPK"



          rm -rf /tmp/starvpn

          mkdir -p /tmp/starvpn



          cp "$IPK" \
          /tmp/starvpn/starvpn.ipk



          cd /tmp/starvpn



          if file starvpn.ipk | grep -qi "debian"; then

              ar x starvpn.ipk

          else

              tar xf starvpn.ipk

          fi



          if [ -f data.tar.gz ]; then

              tar xf data.tar.gz


          elif [ -f data.tar.zst ]; then

              tar \
              --use-compress-program=unzstd \
              -xf data.tar.zst


          else

              echo "StarVPN data missing"

              exit 1

          fi



          cd ${GITHUB_WORKSPACE}



          rm -rf immortalwrt/package/starvpn


          mkdir -p \
          immortalwrt/package/starvpn/files



          test -d /tmp/starvpn/usr



          cp -a \
          /tmp/starvpn/usr/. \
          immortalwrt/package/starvpn/files/



          if [ -d /tmp/starvpn/etc ]; then

              cp -a \
              /tmp/starvpn/etc/. \
              immortalwrt/package/starvpn/files/

          fi



          cat > immortalwrt/package/starvpn/Makefile <<'EOF'
include $(TOPDIR)/rules.mk

PKG_NAME:=starvpn
PKG_VERSION:=6.1.0
PKG_RELEASE:=1

include $(INCLUDE_DIR)/package.mk


define Package/starvpn
 SECTION:=net
 CATEGORY:=Network
 TITLE:=StarVPN
 DEPENDS:=+kmod-tun +iptables
endef


define Package/starvpn/install
	$(CP) ./files/* $(1)/
endef


$(eval $(call BuildPackage,starvpn))
EOF

      - name: Verify StarVPN package
        run: |

          test -f \
          immortalwrt/package/starvpn/Makefile


          test -d \
          immortalwrt/package/starvpn/files



      - name: Verify N30 Pro DTS
        working-directory: immortalwrt
        run: |

          set -e


          DTS="target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts"



          if [ ! -f "$DTS" ]; then

              echo "N30 Pro DTS missing"

              exit 1

          fi



          echo "Checking USB VBUS"



          grep -q \
          "vbus-supply" \
          "$DTS"



          echo "Checking XHCI"



          grep -q \
          "xhci" \
          "$DTS"



          echo "Checking USB PHY"



          grep -Eq \
          "usb_phy|u2phy|u3phy" \
          "$DTS"



      - name: Verify N30 Pro target
        working-directory: immortalwrt
        run: |

          grep -q \
          "Device/netis_nx30v2" \
          target/linux/mediatek/image/filogic.mk



      - name: Update feeds
        working-directory: immortalwrt
        run: |

          echo \
          "src-link starvpn $(pwd)/package/starvpn" \
          >> feeds.conf.default



          ./scripts/feeds update -a



          ./scripts/feeds install -a



      - name: Generate configuration
        working-directory: immortalwrt
        run: |

          cat > .config <<'EOF'
CONFIG_TARGET_mediatek=y
CONFIG_TARGET_mediatek_filogic=y
CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netis_nx30v2=y

CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-ssl=y

CONFIG_PACKAGE_kmod-usb2=y
CONFIG_PACKAGE_kmod-usb3=y
CONFIG_PACKAGE_kmod-usb-xhci-hcd=y
CONFIG_PACKAGE_kmod-usb-storage=y
CONFIG_PACKAGE_kmod-usb-storage-uas=y

CONFIG_PACKAGE_block-mount=y

CONFIG_PACKAGE_kmod-tun=y
CONFIG_PACKAGE_iptables=y

CONFIG_PACKAGE_kmod-usb-net=y
CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y

CONFIG_PACKAGE_kmod-usb-serial=y
CONFIG_PACKAGE_kmod-usb-serial-option=y
CONFIG_PACKAGE_kmod-usb-wdm=y

CONFIG_PACKAGE_usb-modeswitch=y
CONFIG_PACKAGE_uqmi=y
CONFIG_PACKAGE_umbim=y

CONFIG_PACKAGE_mwan3=y
CONFIG_PACKAGE_luci-app-mwan3=y

CONFIG_PACKAGE_samba4-server=y
CONFIG_PACKAGE_luci-app-samba4=y

CONFIG_PACKAGE_starvpn=y
EOF


          make defconfig



      - name: Verify configuration
        working-directory: immortalwrt
        run: |

          grep \
          "netis_nx30v2" \
          .config


          grep \
          "CONFIG_PACKAGE_starvpn=y" \
          .config



      - name: Download sources
        working-directory: immortalwrt
        run: |

          make download \
          -j$(nproc)



      - name: Build firmware
        working-directory: immortalwrt
        run: |

          make \
          -j$(nproc) \
          V=s



      - name: Firmware audit
        working-directory: immortalwrt
        run: |

          TARGET="bin/targets/mediatek/filogic"



          if [ ! -d "$TARGET" ]; then

              echo "Firmware output missing"

              exit 1

          fi



          find "$TARGET" \
          -name "*sysupgrade*" \
          | grep -q .



          if find "$TARGET" \
          -iname "*h3c*" \
          -o \
          -iname "*n60*"; then

              echo "Wrong device firmware detected"

              exit 1

          fi



      - name: Upload firmware
        uses: actions/upload-artifact@v4

        with:

          name: ImmortalWrt-25.12.2-Netcore-N30-Pro-Final

          path: immortalwrt/bin/targets/mediatek/filogic/
