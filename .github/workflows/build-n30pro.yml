name: Build ImmortalWrt 25.12.2 Netcore N30 Pro Final

on:
  workflow_dispatch:


env:
  IMMORTALWRT_TAG: v25.12.2
  PATCH_REPO: https://github.com/liuyi-htu/Netcore-N30-Pro-patch-for-OpenWrt.git


jobs:

  build:

    runs-on: ubuntu-24.04


    steps:


      - name: Checkout repository
        uses: actions/checkout@v5



      - name: Install dependencies
        run: |

          sudo apt update

          sudo apt install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            zstd \
            file \
            patch \
            binutils



      - name: Clone ImmortalWrt
        run: |

          git clone \
          --depth 1 \
          --branch ${IMMORTALWRT_TAG} \
          https://github.com/immortalwrt/immortalwrt.git \
          immortalwrt



      - name: Clone N30 Pro patch
        run: |

          git clone \
          --depth 1 \
          ${PATCH_REPO} \
          n30pro-patch



      - name: Apply N30 Pro patch
        working-directory: immortalwrt
        run: |

          set -e


          PATCH=$(find ../n30pro-patch \
          -name "*.patch" \
          | sort \
          | head -1)


          if [ -z "$PATCH" ]; then

              echo "N30 patch missing"

              exit 1

          fi



          awk '

          BEGIN {
              block=""
              skip=0
          }


          /^diff --git/ {

              if(block!="" && skip==0)
                  print block


              block=$0 "\n"


              if($0 ~ /11_fix_wifi_mac/)
                  skip=1
              else
                  skip=0


              next

          }


          {
              block=block $0 "\n"
          }


          END {

              if(block!="" && skip==0)
                  print block

          }


          ' "$PATCH" > /tmp/n30pro.patch



          patch \
          -p1 \
          --forward \
          < /tmp/n30pro.patch



      - name: Prepare StarVPN package
        run: |

          set -e


          IPK=$(find . \
          -name "starvpn*.ipk" \
          | head -1)



          if [ -z "$IPK" ]; then

              echo "StarVPN IPK missing"

              exit 1

          fi



          echo "Using StarVPN:"
          echo "$IPK"



          rm -rf /tmp/starvpn

          mkdir -p /tmp/starvpn



          cp "$IPK" \
          /tmp/starvpn/starvpn.ipk



          cd /tmp/starvpn



          if file starvpn.ipk | grep -qi "debian"; then

              ar x starvpn.ipk

          else

              tar xf starvpn.ipk

          fi



          if [ -f data.tar.gz ]; then

              tar xf data.tar.gz


          elif [ -f data.tar.zst ]; then

              tar \
              --use-compress-program=unzstd \
              -xf data.tar.zst


          else

              echo "StarVPN data archive missing"

              exit 1

          fi



          cd ${GITHUB_WORKSPACE}



          rm -rf immortalwrt/package/starvpn


          mkdir -p \
          immortalwrt/package/starvpn/files



          test -d /tmp/starvpn/usr



          cp -a \
          /tmp/starvpn/usr/. \
          immortalwrt/package/starvpn/files/



          if [ -d /tmp/starvpn/etc ]; then

              cp -a \
              /tmp/starvpn/etc/. \
              immortalwrt/package/starvpn/files/

          fi



          printf '%s\n' \
          'include $(TOPDIR)/rules.mk' \
          '' \
          'PKG_NAME:=starvpn' \
          'PKG_VERSION:=6.1.0' \
          'PKG_RELEASE:=1' \
          '' \
          'include $(INCLUDE_DIR)/package.mk' \
          '' \
          'define Package/starvpn' \
          ' SECTION:=net' \
          ' CATEGORY:=Network' \
          ' TITLE:=StarVPN' \
          ' DEPENDS:=+kmod-tun +iptables-nft' \
          'endef' \
          '' \
          'define Package/starvpn/install' \
          ' $(CP) ./files/* $(1)/' \
          'endef' \
          '' \
          '$(eval $(call BuildPackage,starvpn))' \
          > immortalwrt/package/starvpn/Makefile



      - name: Verify StarVPN package
        run: |

          test -f \
          immortalwrt/package/starvpn/Makefile


          test -d \
          immortalwrt/package/starvpn/files



      - name: Verify N30 Pro DTS
        working-directory: immortalwrt
        run: |

          DTS="target/linux/mediatek/dts/mt7981b-netcore-n30-pro.dts"



          test -f "$DTS"



          grep -q \
          "vbus-supply" \
          "$DTS"



          grep -q \
          "xhci" \
          "$DTS"



          grep -Eq \
          "usb_phy|u2phy|u3phy" \
          "$DTS"



      - name: Verify target
        working-directory: immortalwrt
        run: |

          grep -q \
          "Device/netis_nx30v2" \
          target/linux/mediatek/image/filogic.mk



      - name: Update feeds
        working-directory: immortalwrt
        run: |

          echo \
          "src-link starvpn $(pwd)/package/starvpn" \
          >> feeds.conf.default



          ./scripts/feeds update -a


          ./scripts/feeds install -a



      - name: Generate configuration
        working-directory: immortalwrt
