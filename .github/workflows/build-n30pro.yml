name: Build ImmortalWrt 25.12.2 Netcore N30 Pro USB Fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Install build dependencies
        shell: bash
        run: |
          set -e

          sudo bash -c \
          'bash <(curl -fsSL https://build-scripts.immortalwrt.org/init_build_environment.sh)'


      - name: Clone ImmortalWrt 25.12.2
        shell: bash
        run: |
          set -e

          git clone \
            --depth 1 \
            --branch v25.12.2 \
            https://github.com/immortalwrt/immortalwrt.git \
            immortalwrt

          cd immortalwrt

          echo "ImmortalWrt:"
          git describe --tags --always

          echo "Commit:"
          git rev-parse HEAD


      - name: Clone Netcore N30 Pro patch
        shell: bash
        run: |
          set -e

          git clone \
            --depth 1 \
            https://github.com/liuyi-htu/Netcore-N30-Pro-patch-for-OpenWrt.git \
            n30-patch


      - name: Apply N30 Pro patch if required
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          DTS_OK=0
          DEVICE_OK=0


          if find target/linux/mediatek/dts \
             -iname "*n30*" \
             | grep -q .; then
              DTS_OK=1
          fi


          if grep -Eq \
          "define Device/.*(n30|nx30)" \
          target/linux/mediatek/image/filogic.mk; then
              DEVICE_OK=1
          fi


          if [ "$DTS_OK" -eq 1 ] && [ "$DEVICE_OK" -eq 1 ]; then

              echo "N30 Pro support already exists"

          else

              echo "Applying N30 Pro adaptation patch"

              bash ../n30-patch/scripts/apply-netcore-n30pro.sh \
              ../n30-patch

          fi


      - name: Verify N30 device definition
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          echo "Available N30 related devices:"


          grep "^define Device/" \
          target/linux/mediatek/image/filogic.mk \
          | grep -Ei "n30|nx30" || true


      - name: Select N30 Pro device
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          DEVICE=""


          if grep -q \
          "^define Device/netcore_n30-pro" \
          target/linux/mediatek/image/filogic.mk; then

              DEVICE="netcore_n30-pro"


          elif grep -q \
          "^define Device/netcore_n30" \
          target/linux/mediatek/image/filogic.mk; then

              DEVICE="netcore_n30"


          elif grep -q \
          "^define Device/netis_nx30v2" \
          target/linux/mediatek/image/filogic.mk; then

              DEVICE="netis_nx30v2"

          fi


          if [ -z "$DEVICE" ]; then
              echo "ERROR: N30 Pro device not found"
              exit 1
          fi


          if echo "$DEVICE" | grep -qi "n60"; then
              echo "ERROR: Wrong device N60"
              exit 1
          fi


          echo "Selected device: $DEVICE"

          echo "N30_DEVICE=$DEVICE" >> "$GITHUB_ENV"

      - name: Verify N30 USB VBUS DTS
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          DTS=$(find target/linux/mediatek/dts \
          -iname "*n30*" \
          -o \
          -iname "*nx30*" \
          | grep ".dts" \
          | head -1)


          if [ -z "$DTS" ]; then
              echo "ERROR: N30 DTS not found"
              exit 1
          fi


          echo "DTS:"
          echo "$DTS"


          grep -Fq \
          "usb-vbus" \
          "$DTS"


          grep -Fq \
          "GPIO_ACTIVE_HIGH" \
          "$DTS"


          grep -Fq \
          "vbus-supply" \
          "$DTS"


          echo "USB VBUS DTS verified"



      - name: Update feeds
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e

          ./scripts/feeds update -a

          ./scripts/feeds install -a



      - name: Generate configuration
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          rm -f .config


          echo "CONFIG_TARGET_mediatek=y" >> .config

          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config

          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_${N30_DEVICE}=y" >> .config


          #
          # LuCI
          #

          echo "CONFIG_PACKAGE_luci=y" >> .config

          echo "CONFIG_PACKAGE_luci-ssl=y" >> .config



          #
          # USB 3 / XHCI
          #

          echo "CONFIG_PACKAGE_kmod-usb3=y" >> .config

          echo "CONFIG_PACKAGE_kmod-usb-xhci-hcd=y" >> .config

          echo "CONFIG_PACKAGE_kmod-usb-xhci-mtk=y" >> .config



          #
          # USB Storage
          #

          echo "CONFIG_PACKAGE_kmod-usb-storage=y" >> .config

          echo "CONFIG_PACKAGE_kmod-usb-storage-uas=y" >> .config

          echo "CONFIG_PACKAGE_block-mount=y" >> .config

          echo "CONFIG_PACKAGE_blockd=y" >> .config



          #
          # Filesystems
          #

          echo "CONFIG_PACKAGE_kmod-fs-ext4=y" >> .config

          echo "CONFIG_PACKAGE_kmod-fs-vfat=y" >> .config

          echo "CONFIG_PACKAGE_kmod-fs-exfat=y" >> .config



          #
          # USB 4G/5G modem
          #

          echo "CONFIG_PACKAGE_kmod-usb-net=y" >> .config

          echo "CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y" >> .config

          echo "CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y" >> .config

          echo "CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y" >> .config

          echo "CONFIG_PACKAGE_kmod-usb-serial=y" >> .config

          echo "CONFIG_PACKAGE_kmod-usb-serial-option=y" >> .config

          echo "CONFIG_PACKAGE_kmod-usb-wdm=y" >> .config

          echo "CONFIG_PACKAGE_usb-modeswitch=y" >> .config

          echo "CONFIG_PACKAGE_uqmi=y" >> .config

          echo "CONFIG_PACKAGE_umbim=y" >> .config



          #
          # MWAN3
          #

          echo "CONFIG_PACKAGE_mwan3=y" >> .config

          echo "CONFIG_PACKAGE_luci-app-mwan3=y" >> .config



          #
          # Samba4
          #

          echo "CONFIG_PACKAGE_samba4-server=y" >> .config

          echo "CONFIG_PACKAGE_luci-app-samba4=y" >> .config



          #
          # Tools
          #

          echo "CONFIG_PACKAGE_curl=y" >> .config

          echo "CONFIG_PACKAGE_wget-ssl=y" >> .config

          echo "CONFIG_PACKAGE_tcpdump=y" >> .config

          echo "CONFIG_PACKAGE_htop=y" >> .config



          make defconfig



          echo "Final target:"
          grep \
          "CONFIG_TARGET_mediatek_filogic_DEVICE" \
          .config



      - name: Verify configuration
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          TARGET=$(grep \
          "CONFIG_TARGET_mediatek_filogic_DEVICE" \
          .config)


          echo "$TARGET"



          if echo "$TARGET" | grep -qi "n60"; then
              echo "ERROR: N60 selected"
              exit 1
          fi


          if ! echo "$TARGET" | grep -Eqi "n30|nx30"; then
              echo "ERROR: Target is not N30"
              exit 1
          fi


          grep -Fq \
          "CONFIG_PACKAGE_kmod-usb3=y" \
          .config


          grep -Fq \
          "CONFIG_PACKAGE_mwan3=y" \
          .config


          grep -Fq \
          "CONFIG_PACKAGE_samba4-server=y" \
          .config


          echo "Configuration verification passed"



      - name: Inject custom IPK
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          mkdir -p \
          files/usr/share/custom-packages


          if [ -d ../custom_packages ]; then

              cp \
              ../custom_packages/*.ipk \
              files/usr/share/custom-packages/ \
              2>/dev/null || true

          fi


          echo "Custom IPK completed"



      - name: Download packages
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          make download \
          -j$(nproc) \
          V=s

      - name: Build firmware
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          echo "================================"
          echo "Start building firmware"
          echo "================================"


          make -j$(nproc) V=s \
          || make -j1 V=s





      - name: Verify XHCI kernel modules
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          echo "Checking xhci-hcd.ko"


          find build_dir \
          -name "xhci-hcd.ko" \
          -print



          echo

          echo "Checking xhci-mtk-hcd.ko"


          find build_dir \
          -name "xhci-mtk-hcd.ko" \
          -print



          XHCI_COUNT=$(find build_dir \
          -name "xhci-hcd.ko" \
          | wc -l)



          MTK_COUNT=$(find build_dir \
          -name "xhci-mtk-hcd.ko" \
          | wc -l)



          if [ "$XHCI_COUNT" -eq 0 ]; then

              echo "ERROR: xhci-hcd.ko missing"

              exit 1

          fi



          if [ "$MTK_COUNT" -eq 0 ]; then

              echo "ERROR: xhci-mtk-hcd.ko missing"

              exit 1

          fi



          echo "XHCI module verification passed"





      - name: Verify rootfs USB modules
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          echo "Checking root filesystem modules"



          find build_dir \
          -path "*/root-*/lib/modules/*" \
          \( \
          -name "xhci-hcd.ko" \
          -o \
          -name "xhci-mtk-hcd.ko" \
          \) \
          -print



          COUNT=$(find build_dir \
          -path "*/root-*/lib/modules/*" \
          \( \
          -name "xhci-hcd.ko" \
          -o \
          -name "xhci-mtk-hcd.ko" \
          \) \
          | wc -l)



          if [ "$COUNT" -lt 2 ]; then

              echo "ERROR: USB XHCI modules missing from rootfs"

              exit 1

          fi



          echo "Rootfs USB module verification passed"





      - name: Verify firmware output
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          TARGET="bin/targets/mediatek/filogic"



          echo "Firmware files:"


          find "$TARGET" \
          -maxdepth 2 \
          -type f \
          -print \
          | sort



          echo

          echo "Checking N60 forbidden output"



          if find "$TARGET" \
          -type f \
          -iname "*n60*" \
          | grep -q .; then


              echo "ERROR: N60 firmware detected"

              exit 1


          fi



          echo

          echo "Checking N30 output"



          if ! find "$TARGET" \
          -type f \
          \( \
          -iname "*n30*" \
          -o \
          -iname "*nx30*" \
          \) \
          | grep -q .; then


              echo "ERROR: N30 firmware not found"

              exit 1

          fi



          echo "Firmware verification passed"





      - name: Generate build report
        shell: bash
        working-directory: immortalwrt
        run: |
          set -e


          REPORT="n30pro-build-report.txt"



          {

          echo "======================================"

          echo "ImmortalWrt 25.12.2 Netcore N30 Pro"

          echo "======================================"



          echo

          echo "Git:"

          git describe --tags --always



          echo

          echo "Commit:"

          git rev-parse HEAD



          echo

          echo "Target:"

          grep \
          "CONFIG_TARGET_mediatek_filogic_DEVICE" \
          .config || true



          echo

          echo "USB packages:"

          grep \
          "CONFIG_PACKAGE_kmod-usb" \
          .config || true



          echo

          echo "XHCI modules:"

          find build_dir \
          -name "xhci*.ko" \
          -print



          echo

          echo "Firmware:"

          find bin/targets/mediatek/filogic \
          -type f \
          | grep -Ei "n30|nx30"



          } > "$REPORT"



          cat "$REPORT"





      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:

          name: ImmortalWrt-25.12.2-Netcore-N30-Pro

          path: |

            immortalwrt/bin/targets/mediatek/filogic/**

            immortalwrt/n30pro-build-report.txt

          if-no-files-found: error

          retention-days: 7
